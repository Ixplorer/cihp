<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <rect width="200" height="60" rx="8" fill="#ffffff" opacity="0.95"/>
  <g transform="translate(10, 10)">
    <!-- EU Circle -->
    <rect width="40" height="40" rx="6" fill="#003399"/>
    <!-- 12 Stars Ring -->
    <g fill="#FFCC00" transform="translate(20,20) scale(0.7)">
      <polygon points="0,-15 3,-6 12,-6 5,0 8,9 0,3 -8,9 -5,0 -12,-6 -3,-6"/>
      <polygon points="7.5,-13 9,-5 17,-2 10,3 12,11 5,6 -2,10 -1,2 -7,-3 1,-5" transform="rotate(30)"/>
      <polygon points="13,-7.5 12,-0 19,5 11,7 10,15 4,9 -4,11 -1,3 -6,-4 2,-4" transform="rotate(60)"/>
      <polygon points="15,0 12,5 17,12 9,11 6,19 1,12 -7,12 -3,5 -7,-2 2,-1" transform="rotate(90)"/>
    </g>
  </g>
  <text x="58" y="26" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" fill="#0f172a">European Union</text>
  <text x="58" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#003399">EDCTP3 Program</text>
</svg>
